[project]
name = "eskom-strategic-intelligence"
version = "1.0.0"
description = "Source-controlled Power BI and analytics-engineering case study for Eskom strategic intelligence"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["EskomStrategicIntelligence.Report", "EskomStrategicIntelligence.SemanticModel"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
